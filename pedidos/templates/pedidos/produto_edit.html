<div class="card" style="align-items: center;">
    <div class="card-header text-bold bg-info text-light" style="align-items: center;width:60%;">
        {% if view_name == "create_produto" %}
        <h5>Criar Produto:</h5>
        {% elif view_name == "edit_produto" %}
        <h5>Alterar Produto:</h5>
        {% endif %}
    </div> <!-- card-header -->

    <div class="card-body" style="align-items: center;width:60%;">
        <p class="card-text">

        <form action="" method="post"> {% csrf_token %}
            <table>
                {{form.as_table}}
                <tr>
                    <td>&nbsp;</td>
                    <td class="text-right">
                        <p>
                            <input class="btn btn-outline-success my-2 my-sm-0" name="submit" type="submit"
                                value="Salvar">
                            {% if view_name == "create_produto" %}
                            <input class="btn btn-outline-success my-2 my-sm-0" name="submit" type="submit"
                                value="Salvar e cadastrar outro">
                            {% endif %}
                            <input class="btn btn-outline-danger my-2 my-sm-0" type="button"
                                onclick="location.href='{% url 'pedido_detail' pedido.codpedido %}'" name="cancel"
                                value="Cancelar">
                        </p>
                    </td>
                </tr>
            </table>
        </form>

        </p>
    </div> <!-- card-body -->
</div> <!-- card -->

<script>
document.addEventListener("DOMContentLoaded", function () {
    const codFornecedorInput = document.getElementById("id_codprodutofornecedor");
    const referenciaInput = document.getElementById("id_referencia");
    const descricaoInput = document.getElementById("id_descricao");
    const valorcustoInput = document.getElementById("id_valorcusto");
    const pedidoInput = document.getElementById("id_pedido");

    if (!codFornecedorInput) return;

    // Criar elemento de notificação visual abaixo do código do fornecedor
    const alertDiv = document.createElement("div");
    alertDiv.id = "autofill-alert";
    alertDiv.className = "text-success font-weight-bold small mt-1";
    alertDiv.style.display = "none";
    alertDiv.innerHTML = '<i class="bi bi-check-circle-fill"></i> Dados preenchidos com base no último produto cadastrado!';
    codFornecedorInput.parentNode.appendChild(alertDiv);

    function buscarUltimoProduto() {
        const codigo = codFornecedorInput.value.trim();
        if (!codigo) {
            alertDiv.style.display = "none";
            return;
        }

        const codpedido = pedidoInput ? pedidoInput.value : "{{ pedido.codpedido }}";
        const url = "{% url 'api_buscar_ultimo_produto' %}?codigo=" + encodeURIComponent(codigo) + "&codpedido=" + encodeURIComponent(codpedido);

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.found) {
                    if (referenciaInput) referenciaInput.value = data.referencia;
                    if (descricaoInput) descricaoInput.value = data.descricao;
                    if (valorcustoInput) valorcustoInput.value = data.valorcusto;
                    alertDiv.style.display = "block";
                } else {
                    alertDiv.style.display = "none";
                }
            })
            .catch(error => {
                console.error("Erro ao buscar dados do produto:", error);
                alertDiv.style.display = "none";
            });
    }

    codFornecedorInput.addEventListener("blur", buscarUltimoProduto);
    codFornecedorInput.addEventListener("change", buscarUltimoProduto);
});
</script>
